openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Road Trip Bingo Word Database API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: words
    description: Bingo word database operations
  - name: boards
    description: Bingo board operations
  - name: snapshots
    description: Database snapshot operations
  - name: ai
    description: AI-powered operations
paths:
  /todos:
    get:
      operationId: listTodos
      tags: [todos]
      summary: List all to-do items
      responses:
        "200":
          description: List of todos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"

    post:
      operationId: createTodo
      tags: [todos]
      summary: Create a to-do item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoBody"
      responses:
        "201":
          description: Created todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"

  /todos/{id}:
    patch:
      operationId: updateTodo
      tags: [todos]
      summary: Update a to-do item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTodoBody"
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteTodo
      tags: [todos]
      summary: Delete a to-do item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /words:
    get:
      operationId: listWords
      tags: [words]
      summary: List all bingo words
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: surroundings
          in: query
          schema:
            type: string
        - name: age
          in: query
          schema:
            type: string
        - name: findability
          in: query
          schema:
            type: string
        - name: season
          in: query
          schema:
            type: string
        - name: boardId
          in: query
          schema:
            type: string
          description: "Comma-separated board IDs to filter by"
        - name: dayNight
          in: query
          schema:
            type: string
        - name: incomplete
          in: query
          schema:
            type: boolean
        - name: complete
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordList"

    post:
      operationId: createWord
      tags: [words]
      summary: Create a new bingo word
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWordBody"
      responses:
        "201":
          description: Created word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Word"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /words/bulk-delete:
    post:
      operationId: bulkDeleteWords
      tags: [words]
      summary: Bulk soft-delete words by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkWordIdsBody"
      responses:
        "200":
          description: Number of words deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"

  /words/bulk-restore:
    post:
      operationId: bulkRestoreWords
      tags: [words]
      summary: Bulk restore soft-deleted words by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkWordIdsBody"
      responses:
        "200":
          description: Number of words restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"

  /words/{id}/restore:
    post:
      operationId: restoreWord
      tags: [words]
      summary: Restore a soft-deleted word
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Word"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /words/{id}:
    get:
      operationId: getWord
      tags: [words]
      summary: Get a single bingo word
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Word details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Word"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateWord
      tags: [words]
      summary: Update a bingo word
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWordBody"
      responses:
        "200":
          description: Updated word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Word"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteWord
      tags: [words]
      summary: Delete a bingo word
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /words/export:
    get:
      operationId: exportWords
      tags: [words]
      summary: Export all words as JSON for the bingo app
      parameters:
        - name: boardId
          in: query
          schema:
            type: string
          description: "Comma-separated board IDs to filter by"
        - name: season
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: surroundings
          in: query
          schema:
            type: string
        - name: age
          in: query
          schema:
            type: string
        - name: findability
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Exported word data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordList"

  /words/stats:
    get:
      operationId: getWordStats
      tags: [words]
      summary: Get database statistics
      responses:
        "200":
          description: Database stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordStats"

  /words/deleted:
    get:
      operationId: listDeletedWords
      tags: [words]
      summary: List soft-deleted words
      responses:
        "200":
          description: List of soft-deleted words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordList"

  /words/purge:
    delete:
      operationId: purgeDeletedWords
      tags: [words]
      summary: Permanently delete all soft-deleted words
      responses:
        "204":
          description: All soft-deleted words purged

  /boards:
    get:
      operationId: listBoards
      tags: [boards]
      summary: List all bingo boards
      responses:
        "200":
          description: List of boards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardList"

    post:
      operationId: createBoard
      tags: [boards]
      summary: Create a new bingo board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardBody"
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /boards/{id}:
    get:
      operationId: getBoard
      tags: [boards]
      summary: Get a single bingo board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Board details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateBoard
      tags: [boards]
      summary: Update a bingo board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardBody"
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteBoard
      tags: [boards]
      summary: Delete a bingo board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      summary: List all database snapshots
      responses:
        "200":
          description: List of snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotList"

    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Create a new database snapshot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotBody"
      responses:
        "200":
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /snapshots/{id}/restore:
    post:
      operationId: restoreSnapshot
      tags: [snapshots]
      summary: Restore a database snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreSnapshotResponse"
        "400":
          description: Invalid snapshot id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /snapshots/{id}:
    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Delete a database snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                required:
                  - deleted
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid snapshot id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/autofill:
    post:
      operationId: autofillWords
      tags: [ai]
      summary: Use AI to autofill missing tags for words
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutofillRequest"
      responses:
        "200":
          description: Autofill results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutofillResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Another AI request is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/suggest:
    post:
      operationId: suggestWords
      tags: [ai]
      summary: Use AI to suggest new words to add to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestWordsRequest"
      responses:
        "200":
          description: Suggested words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestWordsResponse"
        "429":
          description: Another AI request is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Word:
      type: object
      properties:
        id:
          type: integer
        word:
          type: string
        regions:
          type: array
          items:
            type: string
          description: "e.g. All, NE, SE, N Cent, S Cent, NW, SW, HI, AK"
        surroundings:
          type: array
          items:
            type: string
          description: "e.g. All, Rural/Xurban, Suburban/Town, Urban/City, Highway"
        dayNight:
          type: array
          items:
            type: string
          description: "e.g. Day, Night"
        age:
          type: ["string", "null"]
          description: "e.g. Young, Kid, Tween"
        findability:
          type: ["string", "null"]
          description: "e.g. High, Medium, Low"
        seasons:
          type: array
          items:
            type: string
          description: "e.g. All, Spring, Summer, Fall, Winter"
        boards:
          type: array
          items:
            type: string
          description: "Board names (read-only, derived from boardIds)"
        boardIds:
          type: array
          items:
            type: integer
          description: "IDs of boards this word is associated with"
        notes:
          type: ["string", "null"]
        spanish:
          type: ["string", "null"]
          description: "Mexican Spanish translation"
        emoji:
          type: ["string", "null"]
          description: "System emoji representing the word"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - word
        - regions
        - surroundings
        - dayNight
        - age
        - findability
        - seasons
        - boards
        - boardIds
        - notes
        - spanish
        - emoji
        - createdAt
        - updatedAt
        - deletedAt

    WordList:
      type: object
      properties:
        words:
          type: array
          items:
            $ref: "#/components/schemas/Word"
        total:
          type: integer
      required:
        - words
        - total

    CreateWordBody:
      type: object
      properties:
        word:
          type: string
        regions:
          type: array
          items:
            type: string
          default: ["All"]
        surroundings:
          type: array
          items:
            type: string
          default: []
        dayNight:
          type: array
          items:
            type: string
          default: ["Day"]
        age:
          type: ["string", "null"]
          default: null
        findability:
          type: ["string", "null"]
          default: null
        seasons:
          type: array
          items:
            type: string
          default: ["All"]
        boardIds:
          type: array
          items:
            type: integer
          default: []
        notes:
          type: ["string", "null"]
          default: null
        spanish:
          type: ["string", "null"]
          default: null
        emoji:
          type: ["string", "null"]
          default: null
      required:
        - word

    UpdateWordBody:
      type: object
      properties:
        word:
          type: string
        regions:
          type: array
          items:
            type: string
        surroundings:
          type: array
          items:
            type: string
        dayNight:
          type: array
          items:
            type: string
        age:
          type: ["string", "null"]
        findability:
          type: ["string", "null"]
        seasons:
          type: array
          items:
            type: string
        boardIds:
          type: array
          items:
            type: integer
        notes:
          type: ["string", "null"]
        spanish:
          type: ["string", "null"]
        emoji:
          type: ["string", "null"]

    WordStats:
      type: object
      properties:
        total:
          type: integer
        incomplete:
          type: integer
        byFindability:
          type: object
          additionalProperties:
            type: integer
        byAge:
          type: object
          additionalProperties:
            type: integer
        bySeason:
          type: object
          additionalProperties:
            type: integer
        byBoard:
          type: object
          additionalProperties:
            type: integer
        byRegion:
          type: object
          additionalProperties:
            type: integer
        bySurroundings:
          type: object
          additionalProperties:
            type: integer
        byDayNight:
          type: object
          additionalProperties:
            type: integer
      required:
        - total
        - incomplete
        - byFindability
        - byAge
        - bySeason
        - byBoard
        - byRegion
        - bySurroundings
        - byDayNight

    BulkWordIdsBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
      required:
        - ids

    BulkActionResponse:
      type: object
      properties:
        count:
          type: integer
      required:
        - count

    AutofillRequest:
      type: object
      properties:
        wordIds:
          type: array
          items:
            type: integer
          maxItems: 50
          description: IDs of words to autofill. If empty, autofills all incomplete words (capped at 50 per batch).
        fields:
          type: array
          items:
            type: string
          maxItems: 7
          description: "Which fields to autofill: regions, surroundings, dayNight, age, findability, seasons, boards"
      required:
        - fields

    AutofillResponse:
      type: object
      properties:
        updated:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/Word"
      required:
        - updated
        - results

    SuggestWordsRequest:
      type: object
      properties:
        theme:
          type: ["string", "null"]
          maxLength: 200
        count:
          type: integer
          default: 10
          minimum: 1
          maximum: 20
      required: []

    SuggestWordsResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: object
            properties:
              word:
                type: string
              rationale:
                type: string
            required:
              - word
              - rationale
      required:
        - suggestions

    Board:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        ageLevels:
          type: array
          items:
            type: string
          description: "e.g. Young, Kid, Tween"
        difficulty:
          type: ["string", "null"]
          description: "e.g. Easy, Medium, Hard"
        timeOfYear:
          type: ["string", "null"]
          description: "e.g. All Year, Summer, Winter"
        availability:
          type: ["string", "null"]
          description: "e.g. All, Seasonal"
        status:
          type: string
          enum: [active, draft, concept]
        published:
          type: boolean
          description: "Content-release gate: whether this board's content is included in the app-facing export. Independent of lifecycle status."
        publishedAt:
          type: ["string", "null"]
          format: date-time
          description: "When the board was last published, or null if unpublished"
        notes:
          type: ["string", "null"]
        wordCount:
          type: integer
          description: "Number of words assigned to this board"
        coverage:
          $ref: "#/components/schemas/BoardCoverage"
        preview:
          type: array
          items:
            $ref: "#/components/schemas/BoardPreviewWord"
          description: "Deterministic sample of words on this board (seeded by board id, stable across refetches)"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - published
        - publishedAt
        - createdAt
        - updatedAt

    BoardCoverage:
      type: object
      description: "Server-computed curation-quality indicator for a board's word pool"
      properties:
        status:
          type: string
          enum: [well-covered, needs-words, unbalanced]
        label:
          type: string
          description: "Human-readable summary, e.g. 'Needs more words (12/25)' or 'All Low findability'"
      required:
        - status
        - label

    BoardPreviewWord:
      type: object
      properties:
        id:
          type: integer
        word:
          type: string
        emoji:
          type: ["string", "null"]
      required:
        - id
        - word
        - emoji

    BoardList:
      type: object
      properties:
        boards:
          type: array
          items:
            $ref: "#/components/schemas/Board"
        total:
          type: integer
      required:
        - boards
        - total

    CreateBoardBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        ageLevels:
          type: array
          items:
            type: string
          default: []
        difficulty:
          type: ["string", "null"]
        timeOfYear:
          type: ["string", "null"]
        availability:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, draft, concept]
          default: active
        published:
          type: boolean
          default: false
        notes:
          type: ["string", "null"]
      required:
        - name

    UpdateBoardBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        ageLevels:
          type: array
          items:
            type: string
        difficulty:
          type: ["string", "null"]
        timeOfYear:
          type: ["string", "null"]
        availability:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, draft, concept]
        published:
          type: boolean
        notes:
          type: ["string", "null"]

    Snapshot:
      type: object
      properties:
        id:
          type: string
          description: "Snapshot identifier, e.g. snap_1234567890"
        label:
          type: string
          description: "Human-readable label for the snapshot"
        createdAt:
          type: string
          format: date-time
        wordCount:
          type: integer
          description: "Number of words in the snapshot"
        sizeBytes:
          type: integer
          description: "File size of the SQL dump in bytes"
      required:
